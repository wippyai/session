version: "1.0"
namespace: app.api

# Suites for src/api/.
entries:
  - name: request_body_test
    kind: function.lua
    meta:
      name: JSON request bodies
      type: test
      suite: session
      comment: Content-Type gate and capped stream read of the form state POST endpoint
    source: file://request_body_test.lua
    imports:
      request_body: wippy.session.api:request_body
      test: wippy.test:test
    method: run

  - name: artifact_state_access_test
    kind: function.lua
    meta:
      name: Form state endpoints request handling
      type: test
      suite: session
      comment: The form state endpoints' refusals before the state service (no actor, wrong Content-Type, a body over the cap, an unreadable body) and the hand-over to it
    source: file://artifact_state_access_test.lua
    modules:
      - json
      - uuid
      - security
    imports:
      artifact_state_access: wippy.session.api:artifact_state_access
      state_service: wippy.session.forms:state_service
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run

  - name: artifact_endpoints_test
    kind: function.lua
    meta:
      name: Artifact endpoints access
      type: test
      suite: session
      comment: GET /artifact/{id} and /artifact/{id}/content answer a foreign id like a missing one (404, same body) and still serve the owner
    source: file://artifact_endpoints_test.lua
    modules:
      - sql
      - json
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      artifact_access: wippy.session.api:artifact_access
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run

  - name: get_capabilities_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://get_capabilities_test.lua
    imports:
      test: wippy.test:test
      get_capabilities: wippy.session.api:get_capabilities
    method: run

  - name: set_attention_context_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://set_attention_context_test.lua
    imports:
      test: wippy.test:test
      set_attention_context: wippy.session.api:set_attention_context
    method: run

  - name: session_messages_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://session_messages_test.lua
    imports:
      test: wippy.test:test
      session_messages: wippy.session.api:session_messages
    method: run

  - name: context_staging_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://context_staging_test.lua
    modules: [hash, time]
    imports:
      test: wippy.test:test
      context_staging: wippy.session.api:context_staging
      context_attachments: wippy.session:context_attachments
    method: run
