version: "1.0"
namespace: app.api

# Suites for src/api/.
entries:
  - name: request_body_test
    kind: function.lua
    meta:
      name: JSON request bodies
      type: test
      suite: session
      comment: Content-Type gate and capped stream read of the form state POST endpoint
    source: file://request_body_test.lua
    imports:
      request_body: wippy.session.api:request_body
      test: wippy.test:test
    method: run

  - name: artifact_state_access_test
    kind: function.lua
    meta:
      name: Form state endpoints request handling
      type: test
      suite: session
      comment: The form state endpoints' refusals before the state service (no actor, wrong Content-Type, a body over the cap, an unreadable body) and the hand-over to it
    source: file://artifact_state_access_test.lua
    modules:
      - json
      - uuid
      - security
    imports:
      artifact_state_access: wippy.session.api:artifact_state_access
      state_service: wippy.session.forms:state_service
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run

  - name: artifact_endpoints_test
    kind: function.lua
    meta:
      name: Artifact endpoints access
      type: test
      suite: session
      comment: GET /artifact/{id} and /artifact/{id}/content answer a foreign id like a missing one (404, same body) and still serve the owner
    source: file://artifact_endpoints_test.lua
    modules:
      - sql
      - json
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      artifact_access: wippy.session.api:artifact_access
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run

  - name: external_session_events_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://external_session_events_test.lua
    imports:
      upstream: wippy.session.process:upstream
      test: wippy.test:test
      rename_session: wippy.session.api:rename_session
      delete_session: wippy.session.api:delete_session
    method: run

  - name: get_capabilities_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://get_capabilities_test.lua
    imports:
      test: wippy.test:test
      get_capabilities: wippy.session.api:get_capabilities
    method: run

  - name: set_attention_context_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://set_attention_context_test.lua
    imports:
      test: wippy.test:test
      set_attention_context: wippy.session.api:set_attention_context
    method: run

  - name: session_messages_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://session_messages_test.lua
    imports:
      test: wippy.test:test
      session_messages: wippy.session.api:session_messages
    method: run

  - name: context_staging_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://context_staging_test.lua
    modules: [hash, time]
    imports:
      test: wippy.test:test
      context_staging: wippy.session.api:context_staging
      context_attachments: wippy.session:context_attachments
    method: run

  # Web Host routes: GET /agents/details and GET /tools/by-name
  - name: host_routes_test
    kind: function.lua
    meta:
      name: Web Host agent details and tool names
      type: test
      suite: session
      comment: GET /agents/details and GET /tools/by-name against the registry fixtures below (public, untitled, private, colon-name and scalar-prompt agents, a non-agent id, titled, untitled, empty-title, aliased and private tools)
    source: file://host_routes_test.lua
    modules:
      - http
      - json
      - registry
    imports:
      test: wippy.test:test
      agents_details: wippy.session.api:agents_details
      tools_by_name: wippy.session.api:tools_by_name
    method: run

  - name: host_routes_public_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: host-routes-public
      title: Host Routes Helper
    model: gpt-4o
    prompt: Test only.
    start_prompts:
      - Summarize this page
      - text: not a string prompt
      - Draft a reply

  - name: host_routes_untitled_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: host-routes-untitled
    model: gpt-4o
    prompt: Test only.

  - name: host_routes_private_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: host-routes-private
      title: Hidden Helper
      private: true
    model: gpt-4o
    prompt: Test only.
    start_prompts:
      - Hidden prompt

  # Its name is another agent's registry id: an id lookup must still win.
  - name: host_routes_shadow_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: app.api:host_routes_untitled_agent
      title: Shadow Helper
    model: gpt-4o
    prompt: Test only.

  - name: host_routes_colon_name_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: host-routes:colon
      title: Colon Name Helper
    model: gpt-4o
    prompt: Test only.

  - name: host_routes_scalar_prompts_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: host-routes-scalar-prompts
      title: Scalar Prompts Helper
    model: gpt-4o
    prompt: Test only.
    start_prompts: true

  - name: host_routes_private_tool
    kind: function.lua
    meta:
      type: tool
      title: Private Fixture Tool
      llm_alias: host_routes_private_alias
      private: true
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://host_routes_tool.lua
    method: run

  - name: host_routes_empty_title_tool
    kind: function.lua
    meta:
      type: tool
      title: ""
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://host_routes_tool.lua
    method: run

  - name: host_routes_titled_tool
    kind: function.lua
    meta:
      type: tool
      title: Titled Fixture Tool
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://host_routes_tool.lua
    method: run

  - name: host_routes_plain_tool
    kind: function.lua
    meta:
      type: tool
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://host_routes_tool.lua
    method: run

  - name: host_routes_aliased_tool
    kind: function.lua
    meta:
      type: tool
      title: Aliased Fixture Tool
      llm_alias: host_routes_alias
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://host_routes_tool.lua
    method: run
