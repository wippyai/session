version: "1.0"
namespace: app.api

# Suites for src/api/.
entries:
  - name: artifact_state_test
    kind: function.lua
    meta:
      name: Artifact state HTTP adapter
      type: test
      suite: session
      comment: Content-Type gate and capped stream read (the parts of src/api/artifact_state.lua that are genuinely HTTP-layer, not form-layer)
    source: file://artifact_state_test.lua
    imports:
      artifact_state: wippy.session.api:artifact_state
      test: wippy.test:test
    method: run

  - name: artifact_endpoints_test
    kind: function.lua
    meta:
      name: Artifact endpoints access
      type: test
      suite: session
      comment: GET /artifact/{id} and /artifact/{id}/content answer a foreign id like a missing one (404, same body) and still serve the owner
    source: file://artifact_endpoints_test.lua
    modules:
      - sql
      - json
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      get_artifact: wippy.session.api:get_artifact_module
      get_artifact_content: wippy.session.api:get_artifact_content_module
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run
