version: "1.0"
namespace: app

# Harness for the wippy/session module. The module itself is pulled in through
# workspace.replacements in .wippy.yaml, so these entries only wire up the
# resources it asks for and register the suites that sit next to src/*.lua.
entries:
  - name: native_behavior
    kind: function.lua
    meta:
      test_only: true
    source: file://native_behavior.lua
    method: apply

  - name: native_behavior_binding
    kind: contract.binding
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: app:native_behavior

  - name: native_behavior_trait
    kind: registry.entry
    meta:
      type: agent.trait
      test_only: true
    data:
      behaviors:
        - id: native_policy
          kind: policy
          handles: [after_step]
          strict: true
          handlers:
            lifecycle: app:native_behavior_binding

  - name: lifecycle_behavior_trait
    kind: registry.entry
    meta:
      type: agent.trait
      name: Lifecycle Behavior Test Trait
      test_only: true
    data:
      behaviors:
        - id: durable_context
          kind: memory
          handles: [activate, before_step, checkpoint]
          handlers:
            lifecycle: app:lifecycle_test_binding
            checkpoint: app:checkpoint_test_binding
          checkpoint:
            token_threshold: 1200
            max_memory_chars: 2000

  - name: legacy_lifecycle_trait
    kind: registry.entry
    meta:
      type: agent.trait
      name: Legacy Lifecycle Test Trait
      test_only: true
    data:
      bindings:
        lifecycle:
          - id: legacy_lifecycle
            contract: wippy.agent:lifecycle
            binding: app:legacy_lifecycle_test_binding
            phases: [deactivate]
            priority: 200
        checkpoint:
          - id: legacy_checkpoint
            contract: wippy.agent:checkpoint
            binding: app:legacy_checkpoint_test_binding
            priority: 200

  - name: dep.wippy.relay
    kind: ns.dependency
    component: wippy/relay
    version: '*'
    parameters:
      - name: application_host
        value: app:processes
      - name: user_security_scope
        value: app:relay_user

  - name: relay_user
    kind: registry.entry

  - name: lifecycle_tool
    kind: function.lua
    meta:
      type: tool
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://lifecycle_tool.lua
    method: run

  - name: lifecycle_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: gpt-4o
    prompt: Test only.
    tools: [app:lifecycle_tool]

  - name: lifecycle_disconnect_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://interruption_prompt_test.lua
    modules: [time, uuid, security, sql, json]
    imports:
      session_service: wippy.session:service
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      consts: wippy.session:consts
      relay_consts: wippy.relay:consts
      wait_for_boot: app:wait_for_boot
    method: run_lifecycle

  - name: users_fixture_migration
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      timestamp: '2020-01-01T00:00:00Z'
      depends_on: [ns:wippy.migration]
    source: file://users_fixture_migration.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  - name: interruption_plugin_worker
    kind: process.lua
    source: file://interruption_plugin_worker.lua
    imports:
      plugin: wippy.session.process:plugin
      consts: wippy.session:consts
    method: run

  - name: interruption_generate
    kind: function.lua
    source: file://interruption_generate.lua
    method: run
    modules: [ctx, time]
    imports:
      response_mapper: wippy.llm.openai:mapper

  - name: interruption_driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:generator
        methods:
          generate: app:interruption_generate
      - contract: wippy.llm:provider
        methods:
          status: app:interruption_status

  - name: interruption_status
    kind: function.lua
    source: file://interruption_generate.lua
    method: status
    modules: [ctx, time]
    imports:
      response_mapper: wippy.llm.openai:mapper

  - name: interruption_provider
    kind: registry.entry
    meta:
      type: llm.provider
      name: interruption-fixture
    driver:
      id: app:interruption_driver
      options: {}

  - name: interruption_session_worker
    kind: process.lua
    source: file://interruption_session_worker.lua
    modules: [time]
    imports:
      writer: wippy.session.persist:writer
      session: wippy.session.process:session
      llm: wippy.llm:llm
    method: run

  - name: interruption_prompt_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://interruption_prompt_test.lua
    modules: [time, uuid, security, sql, json]
    imports:
      session_service: wippy.session:service
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      consts: wippy.session:consts
      relay_consts: wippy.relay:consts
      wait_for_boot: app:wait_for_boot
    method: run_tests

  - name: interruption_prompt_blocked_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://interruption_prompt_test.lua
    modules: [time, uuid, security, sql, json]
    imports:
      session_service: wippy.session:service
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      consts: wippy.session:consts
      relay_consts: wippy.relay:consts
      wait_for_boot: app:wait_for_boot
    method: run_blocked
  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: ">=v0.4.22"

  - name: prepare_postgres_dependencies
    kind: function.lua
    meta:
      type: bootloader
      order: 19
      requires: [app:db]
    source: file://wait_for_boot.lua
    modules: [sql, time, security]
    imports:
      encryption_key_bootloader: wippy.bootloader.bootloaders:encryption_key
      migration_bootloader: wippy.migration:migration_bootloader
    method: prepare_postgres_dependencies

  - name: context_cleanup_worker
    kind: process.lua
    source: file://context_cleanup_worker.lua
    modules: [env, sql, security]
    imports:
      context_cleanup: wippy.session.process:context_cleanup_runtime
    method: run

  - name: context_cleanup_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://context_cleanup_runtime_test.lua
    modules: [time, uuid, sql, security]
    imports:
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      context_staging_repo: wippy.session.persist:context_staging_repo
      context_cleanup: wippy.session.process:context_cleanup_runtime
      consts: wippy.session:consts
      relay_consts: wippy.relay:consts
      wait_for_boot: app:wait_for_boot
    method: run

  - name: context_transport_reply_policy
    kind: security.policy
    policy:
      actions: [process.send]
      resources: '*'
      effect: allow
      conditions:
        - field: resource
          operator: eq
          value_from: actor.meta.context_transport_reply_pid

  - name: context_transport_name_policy
    kind: security.policy
    policy:
      actions: [process.registry.register]
      resources: 'session.*'
      effect: allow

  - name: context_transport_env_policy
    kind: security.policy
    policy:
      actions: [env.get]
      resources: 'wippy.session.env:*'
      effect: allow

  - name: context_transport_db_policy
    kind: security.policy
    policy:
      actions: [db.get]
      resources: 'app:db'
      effect: allow

  - name: context_transport_session_policy
    kind: security.policy
    policy:
      actions: [read, write]
      resources: 'session:*'
      effect: allow

  - name: context_transport_worker
    kind: process.lua
    source: file://context_transport_worker.lua
    modules: [time]
    imports:
      writer: wippy.session.persist:writer
      message_handlers: wippy.session.process:message_handlers
      context_staging_repo: wippy.session.persist:context_staging_repo
      session_repo: wippy.session.persist:session_repo
    method: run

  - name: context_transport_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://context_transport_runtime_test.lua
    modules: [time, uuid, hash, sql, security]
    imports:
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      session_handlers: wippy.session.process:session_handlers
      session_service: wippy.session:service
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      context_attachments: wippy.session:context_attachments
      context_staging_repo: wippy.session.persist:context_staging_repo
      consts: wippy.session:consts
      upstream: wippy.session.process:upstream
      relay_consts: wippy.relay:consts
      wait_for_boot: app:wait_for_boot
    method: run

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: File-backed SQLite, recreated on every run by `make test`. A plain in-memory DB gives each pooled connection its own empty database, so the schema can vanish under parallel test connections.
    file: ./.wippy/test.db
    pool:
      max_idle: 2

  - name: migration_probe_db
    kind: db.sql.sqlite
    meta:
      comment: Disposable database for migration tests; each test recreates the tables it needs.
    file: ./.wippy/migration-probe.db

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    meta:
      comment: Process host for the bootloader and the session services
    host:
      workers: 2
      max_processes: 10
    lifecycle:
      auto_start: true

  # The module's HTTP endpoints declare a router, so a router (and its server)
  # has to exist for the registry to resolve. Nothing in this suite calls over
  # HTTP, so the server itself never starts.
  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19087
    lifecycle:
      auto_start: false

  - name: api
    kind: http.router
    meta:
      comment: Test API router
      server: gateway
    prefix: /api

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: encryption_key
    kind: env.variable
    meta:
      comment: Fixed key, so the encryption bootloader has nothing to generate
    readonly: false
    storage: app:env_storage
    default: "046e5a0594bb339ef5ddcd8c3a9b9b828ed066d53ee99138ec6da8795e38b55d"
    variable: ENCRYPTION_KEY

  # Every ns.dependency needs an explicit version constraint; without one the
  # runtime refuses the whole changeset with "invalid dependency resolution".
  - name: dep.wippy.session
    kind: ns.dependency
    meta:
      description: The module under test
    component: "wippy/session"
    version: ">=0.4.1"
    parameters:
      - name: database_resource
        value: app:db
      - name: api_router
        value: app:api.public
      - name: env_storage
        value: app:env_storage
      - name: ui_action_ttl_seconds
        value: "2"
      - name: default_host
        value: app:processes
      - name: on_session_end_func_id
        value: app:end_hook_capture

  - name: dep.wippy.bootloader
    kind: ns.dependency
    meta:
      description: Bootloader, wired to the test env storage
    component: "wippy/bootloader"
    version: ">=0.3.14"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.migration
    kind: ns.dependency
    meta:
      description: Migration runner, applies the session tables to app:db
    component: "wippy/migration"
    version: ">=0.3.18"
    parameters:
      - name: app_db
        value: app:db

  - name: dep.wippy.security
    kind: ns.dependency
    meta:
      description: Security policies (the process policy group supervised services declare)
    component: "wippy/security"
    version: ">=0.4.2"

  - name: dep.wippy.llm
    kind: ns.dependency
    meta:
      description: LLM module, the session builds its prompts through it
    component: "wippy/llm"
    version: ">=0.4.46"
    parameters:
      - name: process_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.views
    kind: ns.dependency
    meta:
      description: Views module, the session renders artifacts through it
    component: "wippy/views"
    version: ">=0.5.10"
    parameters:
      - name: api_router
        value: app:api.public
      - name: env_storage
        value: app:env_storage
      - name: server
        value: app:gateway

  - name: wait_for_boot
    kind: function.lua
    meta:
      comment: Runs the bootloaders and waits for the session tables; suites that touch the database call it from before_all
    source: file://wait_for_boot.lua
    modules:
      - sql
      - time
      - security
    imports:
      encryption_key_bootloader: wippy.bootloader.bootloaders:encryption_key
      migration_bootloader: wippy.migration:migration_bootloader
    method: run

  - name: test_security_policy
    kind: security.policy
    meta:
      comment: Lets the session service contract test open the built-in binding
    policy:
      actions: "*"
      resources: "*"
      effect: allow
    groups:
      - test_group

  - name: end_hook_capture
    kind: function.lua
    meta:
      comment: Records the plugin's session end payload for lifecycle tests
    source: file://process/end_hook_capture.lua
    modules:
      - json
      - uuid
    imports:
      consts: wippy.session:consts
      message_repo: wippy.session.persist:message_repo
    method: run

  # Suites for src/*.lua
  - name: prompt_builder_test
    kind: function.lua
    meta:
      name: Prompt builder
      type: test
      suite: session
      comment: Tests the prompt builder functionality
    source: file://prompt_builder_test.lua
    modules:
      - json
      - hash
    imports:
      claude_mapper: wippy.llm.claude:mapper
      context_attachments: wippy.session:context_attachments
      google_mapper: wippy.llm.google:mapper
      consts: wippy.session:consts
      prompt_builder: wippy.session:prompt_builder
      test: wippy.test:test
    method: run

  - name: service_test
    kind: function.lua
    meta:
      name: Session service contract
      type: test
      suite: session
      comment: Tests the session-owned service SDK and contract binding
    source: file://service_test.lua
    modules:
      - contract
      - json
      - security
      - sql
      - uuid
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      service: wippy.session:service
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: start_tokens_test
    kind: function.lua
    meta:
      name: Start tokens
      type: test
      suite: session
      comment: Tests the start_tokens library for creating and validating session start tokens
    source: file://start_tokens_test.lua
    modules:
      - base64
    imports:
      start_tokens: wippy.session:start_tokens
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: prompt_window_test
    kind: function.lua
    meta:
      name: Prompt window since checkpoint
      type: test
      suite: session
      comment: The prompt rebuilt since the current checkpoint must keep the newest messages when the conversation outgrows the default message page
    source: file://prompt_window_test.lua
    modules:
      - contract
      - json
      - security
      - sql
      - uuid
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run_tests

  - name: steering_first_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Steering first fixture
    model: gpt-4o
    prompt: Test only.
    traits: [wippy.session.traits:steering, wippy.session.traits:input_control]

  - name: control_first_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Control first fixture
    model: gpt-4o
    prompt: Test only.
    traits: [wippy.session.traits:input_control, wippy.session.traits:steering]

  - name: steering_traits_test
    kind: function.lua
    meta:
      name: Session trait compilation
      type: test
      suite: session
    source: file://steering_traits_test.lua
    imports:
      agent_context: wippy.agent:context
      input_policy: wippy.session.process:input_policy
      test: wippy.test:test
    method: run_tests

  - name: attention_monitor_worker
    kind: process.lua
    source: file://attention_monitor_worker.lua
    modules:
      - time
    method: run

  - name: attention_monitor_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
      comment: Exercises real monitor and unmonitor without terminating the target
    source: file://attention_monitor_test.lua
    modules:
      - time
    imports:
      test: wippy.test:test
    method: run

  - name: attention_context_state_worker
    kind: process.lua
    source: file://attention_context_state_worker.lua
    imports:
      session_repo: wippy.session.persist:session_repo
    method: run

  - name: attention_context_state_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: session_runtime
    source: file://attention_context_state_runtime_test.lua
    modules: [time, uuid, security]
    imports:
      test: wippy.test:test
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      wait_for_boot: app:wait_for_boot
    method: run

  - name: file_provider_func
    kind: function.lua
    source: file://file_provider_func.lua
    method: get_info

  - name: file_provider
    kind: contract.binding
    contracts:
      - contract: wippy.session:file_provider
        default: true
        methods:
          get_info: app:file_provider_func

  - name: context_attachments_test
    kind: function.lua
    meta:
      type: test
      suite: session
      comment: Tests message context attachment validation and cross-language golden vectors
    source: file://context_attachments_test.lua
    modules:
      - json
      - hash
      - time
    imports:
      prompt_builder: wippy.session:prompt_builder
      context_attachments: wippy.session:context_attachments
      test: wippy.test:test
    method: run
