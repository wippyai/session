version: "1.0"
namespace: app.runtime

entries:
  - name: benchmark_output
    kind: fs.directory
    directory: /tmp/wippy-session-tests/benchmarks

  - name: benchmark_report
    kind: library.lua
    source: file://benchmark_report.lua
    modules: [fs, json, env, io, system, http_client]

  - name: benchmark_env
    kind: env.storage.os

  - name: benchmark_samples
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_SAMPLES

  - name: benchmark_memory_operations
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_MEMORY_OPERATIONS

  - name: benchmark_exact_allocations
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_EXACT_ALLOCATIONS

  - name: benchmark_warmup
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_WARMUP

  - name: benchmark_size
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_SIZE

  - name: benchmark_revision
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_REVISION

  - name: benchmark_runtime
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_RUNTIME

  - name: benchmark_framework_revision
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_BENCH_FRAMEWORK_REVISION

  - name: require_cases
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_TEST_REQUIRE_CASES

  - name: repository
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_TEST_REPOSITORY

  - name: artifacts
    kind: env.variable
    storage: app.runtime:benchmark_env
    variable: WIPPY_TEST_ARTIFACTS

  - name: executor
    kind: exec.native

  - name: bootstrap_test
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 20s
    source: file://bootstrap_test.lua
    method: run
    modules: [exec, env, json, uuid]
    imports:
      test: wippy.test:test

  - name: state
    kind: store.memory
    max_size: 100

  - name: generate
    kind: function.lua
    source: file://fixtures.lua
    method: generate
    modules: [store, json, time]

  - name: driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:generator
        methods:
          generate: app.runtime:generate
      - contract: wippy.llm:provider
        methods:
          status: app.runtime:generate

  - name: provider
    kind: registry.entry
    meta:
      type: llm.provider
      name: session-runtime-fixture
    driver:
      id: app.runtime:driver
      options: {}

  - name: router_model
    kind: registry.entry
    meta:
      type: llm.model
      name: session-runtime-router
      capabilities: [generate, tool_use]
    max_tokens: 4096
    output_tokens: 256
    providers:
      - id: app.runtime:provider
        provider_model: router

  - name: help_model
    kind: registry.entry
    meta:
      type: llm.model
      name: session-runtime-help
      capabilities: [generate, tool_use]
    max_tokens: 4096
    output_tokens: 256
    providers:
      - id: app.runtime:provider
        provider_model: help

  - name: router
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Session runtime router
    model: session-runtime-router
    prompt: Route the request using the handoff tool.
    tools:
      - id: app.runtime:handoff
        alias: handoff
      - id: app.runtime:failing_tool
        alias: failing_tool
      - id: app.runtime:malformed_effects
        alias: malformed_effects

  - name: help
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Session runtime help
    model: session-runtime-help
    prompt: Answer using the chronological conversation and handoff result.
    traits:
      - app.runtime:held_prompt_trait

  - name: held_prompt_trait
    kind: registry.entry
    meta:
      type: agent.trait
      name: Held prompt
    prompt_func_id: app.runtime:held_prompt

  - name: held_prompt
    kind: function.lua
    source: file://fixtures.lua
    method: held_prompt
    modules: [store, json, time]

  - name: handoff
    kind: function.lua
    meta:
      type: tool
      name: handoff
      description: Transfer the active session to the help agent.
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: handoff
    modules: [store, json, time]

  - name: checkpoint_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-help
    prompt: Finish the user's document task, using tool results and checkpoint progress.
    tools: [app.runtime:checkpoint_edit]
    memory_contract:
      implementation_id: app.runtime:checkpoint_memory
      options:
        min_conversation_length: 2
        recall_cooldown: 0

  - name: checkpoint_edit
    kind: function.lua
    meta:
      type: tool
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: checkpoint_edit
    modules: [store, time]

  - name: checkpoint_summary
    kind: function.lua
    source: file://fixtures.lua
    method: checkpoint_summary
    modules: [store, time]

  - name: checkpoint_recall
    kind: function.lua
    source: file://fixtures.lua
    method: checkpoint_recall
    modules: [store, time]

  - name: checkpoint_memory
    kind: contract.binding
    contracts:
      - contract: wippy.agent:memory
        methods:
          recall: app.runtime:checkpoint_recall

  - name: prefix_model
    kind: registry.entry
    meta:
      type: llm.model
      name: session-runtime-prefix
      capabilities: [generate, tool_use]
    max_tokens: 4096
    output_tokens: 256
    providers:
      - id: app.runtime:provider
        provider_model: prefix

  - name: prefix_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-prefix
    prompt: Pack the user's document with the edit tool, then answer.
    tools: [app.runtime:checkpoint_edit]
    traits:
      - wippy.agent.traits:time_aware
      - app.runtime:prefix_lifecycle_trait
    memory_contract:
      implementation_id: app.runtime:checkpoint_memory
      options:
        min_conversation_length: 1
        recall_cooldown: 0

  - name: parallel_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-prefix
    prompt: Run both edits, then answer.
    tools: [app.runtime:checkpoint_edit]

  - name: time_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-prefix
    prompt: Answer with the current time.
    traits:
      - wippy.agent.traits:time_aware

  - name: loader_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-prefix
    prompt: Load the pack when the task needs it, then use its tool.
    tools: [app.runtime:load_pack]
    agent_options:
      trait_loading: append

  - name: rebuilding_loader_agent
    kind: registry.entry
    meta:
      type: agent.gen1
    model: session-runtime-prefix
    prompt: Load the pack when the task needs it, then use its tool.
    tools: [app.runtime:load_pack]

  - name: pack_trait
    kind: registry.entry
    meta:
      type: agent.trait
      name: Pack
    data:
      prompt: Pack guidance. Use pack_tool for packed documents.
      tools: [app.runtime:pack_tool, app.runtime:load_pack]

  - name: load_pack
    kind: function.lua
    meta:
      type: tool
      name: load_pack
      description: Load the pack into this conversation.
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: load_pack
    modules: [store, time]

  - name: pack_tool
    kind: function.lua
    meta:
      type: tool
      name: pack_tool
      description: Pack the document.
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: pack_tool
    modules: [store, time]

  - name: prefix_lifecycle
    kind: function.lua
    source: file://fixtures.lua
    method: prefix_lifecycle
    modules: [store, time]

  - name: prefix_lifecycle_binding
    kind: contract.binding
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: app.runtime:prefix_lifecycle

  - name: prefix_lifecycle_trait
    kind: registry.entry
    meta:
      type: agent.trait
      name: Prefix lifecycle notes
    data:
      behaviors:
        - id: prefix_notes
          kind: policy
          handles: [activate, before_step]
          handlers:
            lifecycle: app.runtime:prefix_lifecycle_binding

  - name: stable_prefix_runtime
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 60s
    source: file://handoff_test.lua
    method: stable_prefix
    modules: [store, security, uuid, time, json, env]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report
      framework_capabilities: app.runtime:framework_capabilities

  - name: failing_tool
    kind: function.lua
    meta:
      type: tool
      name: failing_tool
      description: Return a deterministic tool execution error.
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: fail
    modules: [store, json, time]

  - name: malformed_effects
    kind: function.lua
    meta:
      type: tool
      name: malformed_effects
      description: Return a deterministic malformed control payload.
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://fixtures.lua
    method: malformed_effects
    modules: [store, json, time]

  - name: checkpoint_runtime
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 60s
    source: file://handoff_test.lua
    method: checkpoint
    modules: [store, security, uuid, time, json, env]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report
      framework_capabilities: app.runtime:framework_capabilities
      agent: wippy.agent:agent
      prompt: wippy.llm:prompt

  - name: framework_capabilities
    kind: library.lua
    source: file://framework_capabilities.lua
    imports:
      agent: wippy.agent:agent
      prompt: wippy.llm:prompt

  - name: stream_model
    kind: registry.entry
    meta:
      type: llm.model
      name: session-runtime-stream
      capabilities: [generate, tool_use]
    max_tokens: 4096
    output_tokens: 256
    providers:
      - id: app.runtime:provider
        provider_model: stream

  - name: streamer
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Session runtime streamer
    model: session-runtime-stream
    prompt: Answer the question.

  - name: session_readiness
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 60s
    source: file://handoff_test.lua
    method: readiness
    modules: [store, security, uuid, time, json, env]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report
      framework_capabilities: app.runtime:framework_capabilities

  - name: handoff_runtime
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 60s
    source: file://handoff_test.lua
    method: run
    modules: [store, security, uuid, time, json, env]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report
      framework_capabilities: app.runtime:framework_capabilities

  - name: handoff_benchmark
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 180s
    source: file://handoff_test.lua
    method: benchmark
    modules: [store, security, uuid, time, json, env]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report
      framework_capabilities: app.runtime:framework_capabilities

  - name: metadata_benchmark
    kind: function.lua
    meta:
      type: test
      suite: session-runtime
      timeout: 180s
    source: file://metadata_benchmark.lua
    method: run
    modules: [security, uuid, time, env, sql]
    imports:
      test: wippy.test:test
      writer: wippy.session.persist:writer
      message_repo: wippy.session.persist:message_repo
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      wait_for_boot: app:wait_for_boot
      benchmark_report: app.runtime:benchmark_report

  # Tool approval with real Session processes (approval_runtime_test.lua):
  # a scripted model, tools that record each launch, the Session process
  # with injection points, the real session plugin and client connections.
  - name: approval_state
    kind: store.memory
    max_size: 4000

  - name: approval_generate
    kind: function.lua
    source: file://approval_fixtures.lua
    method: generate
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_status
    kind: function.lua
    source: file://approval_fixtures.lua
    method: status
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:generator
        methods:
          generate: app.runtime:approval_generate
      - contract: wippy.llm:provider
        methods:
          status: app.runtime:approval_status

  - name: approval_provider
    kind: registry.entry
    meta:
      type: llm.provider
      name: session-approval-fixture
    driver:
      id: app.runtime:approval_driver
      options: {}

  - name: approval_marked_tool
    kind: function.lua
    meta:
      type: tool
      title: Delete record
      description: Permanently deletes a record.
      approval: required
      input_schema: '{"type":"object","properties":{"n":{"type":"integer"}},"additionalProperties":false}'
    source: file://approval_fixtures.lua
    method: tool
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_plain_tool
    kind: function.lua
    meta:
      type: tool
      title: Look up record
      input_schema: '{"type":"object","properties":{"n":{"type":"integer"}},"additionalProperties":false}'
    source: file://approval_fixtures.lua
    method: tool
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_granted_tool
    kind: function.lua
    meta:
      type: tool
      title: Send invoice
      approval:
        required: true
        approve_all: true
      input_schema: '{"type":"object","properties":{"n":{"type":"integer"}},"additionalProperties":false}'
    source: file://approval_fixtures.lua
    method: tool
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_agent
    kind: registry.entry
    meta:
      type: agent.gen1
      name: Session approval runtime agent
    model: gpt-4o
    prompt: Test only.
    tools:
      - app.runtime:approval_marked_tool
      - app.runtime:approval_plain_tool
      - app.runtime:approval_granted_tool
    traits:
      - wippy.session.traits:steering
      - app:native_behavior_trait
      - id: wippy.session.traits:tool_approval
        context:
          require: marked
          approve_all: tool

  - name: approval_connection
    kind: process.lua
    source: file://approval_fixtures.lua
    method: connection
    modules: [ctx, store, time, sql]
    imports:
      consts: wippy.session:consts

  - name: approval_session_worker
    kind: process.lua
    source: file://approval_session_worker.lua
    method: run
    modules: [time, store]
    imports:
      session: wippy.session.process:session
      llm: wippy.llm:llm
      approval_gate: wippy.session.approval:gate
      activation: wippy.session.approval:activation
      approval_repo: wippy.session.persist:approval_repo
      approval_commands: wippy.session.approval:commands
      approval_events: wippy.session.approval:events
      upstream: wippy.session.process:upstream
      message_handlers: wippy.session.process:message_handlers
      approval_recovery: wippy.session.approval:recovery
      details_policy: wippy.session.details:policy

  - name: approval_plugin_worker
    kind: process.lua
    source: file://approval_plugin_worker.lua
    method: run
    imports:
      plugin: wippy.session.process:plugin
      consts: wippy.session:consts

  - name: approval_runtime_wait
    kind: function.lua
    meta:
      type: test
      suite: session-approval-runtime
      timeout: 180s
    source: file://approval_runtime_test.lua
    method: wait
    modules: [security, store, uuid, time, json, sql]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      approval_repo: wippy.session.persist:approval_repo
      session_service: wippy.session:service
      wait_for_boot: app:wait_for_boot
      details_policy: wippy.session.details:policy
      session_messages: wippy.session.api:session_messages

  - name: approval_runtime_recovery
    kind: function.lua
    meta:
      type: test
      suite: session-approval-runtime
      timeout: 240s
    source: file://approval_runtime_test.lua
    method: recovery
    modules: [security, store, uuid, time, json, sql]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      approval_repo: wippy.session.persist:approval_repo
      session_service: wippy.session:service
      wait_for_boot: app:wait_for_boot
      details_policy: wippy.session.details:policy
      session_messages: wippy.session.api:session_messages

  - name: approval_runtime_surfaces
    kind: function.lua
    meta:
      type: test
      suite: session-approval-runtime
      timeout: 180s
    source: file://approval_runtime_test.lua
    method: surfaces
    modules: [security, store, uuid, time, json, sql]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      approval_repo: wippy.session.persist:approval_repo
      session_service: wippy.session:service
      wait_for_boot: app:wait_for_boot
      details_policy: wippy.session.details:policy
      session_messages: wippy.session.api:session_messages

  - name: approval_runtime_injection
    kind: function.lua
    meta:
      type: test
      suite: session-approval-runtime
      timeout: 300s
    source: file://approval_runtime_test.lua
    method: injection
    modules: [security, store, uuid, time, json, sql]
    imports:
      test: wippy.test:test
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      approval_repo: wippy.session.persist:approval_repo
      session_service: wippy.session:service
      wait_for_boot: app:wait_for_boot
      details_policy: wippy.session.details:policy
      session_messages: wippy.session.api:session_messages
