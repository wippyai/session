    kind: function.lua
    meta:
      name: Session status reporting
      type: test
      suite: session
      comment: A stored running status with no registered process reads as idle, with the interaction recovery will store
    source: file://session_status_test.lua
    imports:
      session_status: wippy.session.process:session_status
      test: wippy.test:test
    method: run

