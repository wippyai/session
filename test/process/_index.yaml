version: "1.0"
namespace: app.process

# Suites for src/process/.
entries:
  - name: stop_control_test
    kind: function.lua
    meta:
      name: Stop persistence boundary
      type: test
      suite: session
    source: file://stop_control_test.lua
    imports:
      session: wippy.session.process:session
      test: wippy.test:test
    method: run_tests

  - name: session_test
    kind: function.lua
    meta:
      name: Session ingress routing
      type: test
      suite: session
    source: file://session_test.lua
    imports:
      consts: wippy.session:consts
      session: wippy.session.process:session
      message_handlers: wippy.session.process:message_handlers
      command_bus: wippy.session.process:command_bus
      control_handlers: wippy.session.process:control_handlers
      test: wippy.test:test
    method: run_tests
  - name: control_handlers_test
    kind: function.lua
    meta:
      name: Control config overlays
      type: test
      suite: session
      comment: Unit tests for control_config trait/tool overlay routing, plus a real-DB artifact meta_patch/publish test
    source: file://control_handlers_test.lua
    modules:
      - uuid
      - security
    imports:
      command_bus: wippy.session.process:command_bus
      consts: wippy.session:consts
      control_handlers: wippy.session.process:control_handlers
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      artifact_repo: wippy.session.persist:artifact_repo
      writer: wippy.session.persist:writer
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run_tests

  - name: forms_test
    kind: function.lua
    meta:
      name: Session forms in the session process
      type: test
      suite: session
      comment: Form creation through ask_user and process_tools (origin binding, one form per turn, end of turn, failure row rewrite, no wait for the session title) and admission of accepted answers (idle, during a turn, scans, one status change into the next turn) on the real database
    source: file://forms_test.lua
    modules:
      - json
      - sql
      - uuid
      - funcs
      - security
      - time
    imports:
      consts: wippy.session:consts
      command_bus: wippy.session.process:command_bus
      message_handlers: wippy.session.process:message_handlers
      control_handlers: wippy.session.process:control_handlers
      session_handlers: wippy.session.process:session_handlers
      session: wippy.session.process:session
      state_service: wippy.session.forms:state_service
      prompt_builder: wippy.session:prompt_builder
      artifact_repo: wippy.session.persist:artifact_repo
      message_repo: wippy.session.persist:message_repo
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run_tests

  - name: plugin_test
    kind: function.lua
    meta:
      name: Plugin routing and recovery
      type: test
      suite: session
      comment: Tests session routing, exit recovery, and end hooks
    source: file://plugin_test.lua
    modules:
      - security
      - time
      - json
      - uuid
      - logger
      - funcs
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      message_handlers: wippy.session.process:message_handlers
      plugin: wippy.session.process:plugin
      session: wippy.session.process:session
      session_repo: wippy.session.persist:session_repo
      start_tokens: wippy.session:start_tokens
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
      writer: wippy.session.persist:writer
    method: run_tests

  - name: session_handlers_test
    kind: function.lua
    meta:
      name: Session config normalization
      type: test
      suite: session
      comment: Unit tests for session config normalization during agent/model changes, an agent then model choice on the real database, and title generation beside the turn
    source: file://session_handlers_test.lua
    modules:
      - sql
      - uuid
      - security
    imports:
      consts: wippy.session:consts
      session_handlers: wippy.session.process:session_handlers
      command_bus: wippy.session.process:command_bus
      session: wippy.session.process:session
      reader: wippy.session.persist:reader
      writer: wippy.session.persist:writer
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run_tests

  - name: message_handlers_test
    kind: function.lua
    meta:
      name: Message handling and tool rounds
      type: test
      suite: session
      comment: Tests tool persistence, stops, and checkpoints
    source: file://message_handlers_test.lua
    imports:
      command_bus: wippy.session.process:command_bus
      consts: wippy.session:consts
      control_handlers: wippy.session.process:control_handlers
      message_handlers: wippy.session.process:message_handlers
      session_handlers: wippy.session.process:session_handlers
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: run_tests

  - name: command_bus_test
    kind: function.lua
    meta:
      name: Command bus termination
      type: test
      suite: session
      comment: finish() and intercept() must stop a self-perpetuating chain of operations once the in-flight one completes
    source: file://command_bus_test.lua
    modules:
      - time
      - uuid
      - security
    imports:
      command_bus: wippy.session.process:command_bus
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      message_handlers: wippy.session.process:message_handlers
      message_repo: wippy.session.persist:message_repo
      reader: wippy.session.persist:reader
      session: wippy.session.process:session
      session_repo: wippy.session.persist:session_repo
      wait_for_boot: app:wait_for_boot
      writer: wippy.session.persist:writer
      test: wippy.test:test
    method: run_tests

  - name: upstream_test
    kind: function.lua
    meta:
      name: Session response protocol
      type: test
      suite: session
    source: file://upstream_test.lua
    imports:
      upstream: wippy.session.process:upstream
      test: wippy.test:test
    method: run_tests

  - name: input_policy_test
    kind: function.lua
    meta:
      name: Session input policy
      type: test
      suite: session
    source: file://input_policy_test.lua
    imports:
      input_policy: wippy.session.process:input_policy
      test: wippy.test:test
    method: run_tests

  - name: steering_test
    kind: function.lua
    meta:
      name: Session steering lifecycle
      type: test
      suite: session
    source: file://steering_test.lua
    imports:
      consts: wippy.session:consts
      input_policy: wippy.session.process:input_policy
      message_handlers: wippy.session.process:message_handlers
      prompt_builder: wippy.session:prompt_builder
