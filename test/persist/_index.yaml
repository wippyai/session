version: "1.0"
namespace: app.persist

# Suites for src/persist/.
entries:
  - name: artifact_repo_test
    kind: function.lua
    meta:
      name: Artifact repository
      type: test
      suite: session
      comment: Tests the artifact repository functionality
    source: file://artifact_repo_test.lua
    modules:
      - sql
      - uuid
      - json
      - time
      - security
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: context_repo_test
    kind: function.lua
    meta:
      name: Context repository
      type: test
      suite: session
      comment: Tests the context repository functionality
    source: file://context_repo_test.lua
    modules:
      - sql
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: message_repo_test
    kind: function.lua
    meta:
      name: Message repository
      type: test
      suite: session
      comment: Tests the message repository functionality
    source: file://message_repo_test.lua
    modules:
      - sql
      - uuid
      - json
      - time
      - security
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      message_repo: wippy.session.persist:message_repo
      artifact_repo: wippy.session.persist:artifact_repo
      form_recovery: wippy.session.forms:form_recovery
      message_date: wippy.session.persist:message_date
      tx: wippy.session.persist:tx
      writer: wippy.session.persist:writer
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: session_contexts_repo_test
    kind: function.lua
    meta:
      name: Session contexts repository
      type: test
      suite: session
      comment: Tests the session contexts repository functionality
    source: file://session_contexts_repo_test.lua
    modules:
      - sql
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      session_contexts_repo: wippy.session.persist:session_contexts_repo
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: session_repo_test
    kind: function.lua
    meta:
      name: Session repository
      type: test
      suite: session
      comment: Tests the session repository functionality
    source: file://session_repo_test.lua
    modules:
      - sql
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: artifact_events_test
    kind: function.lua
    meta:
      name: Artifact event publisher
      type: test
      suite: session
      comment: Publisher addresses the owner's hub (never the caller), drops silently without one, and is a no-op for a nil/ownerless artifact
    source: file://artifact_events_test.lua
    imports:
      artifact_events: wippy.session.persist:artifact_events
      test: wippy.test:test
    method: run

  - name: shared_transaction_test
    kind: function.lua
    meta:
      name: Shared transaction (artifact update + message create)
      type: test
      suite: session
      comment: Commit, rollback, and mid-transaction failure across a caller-supplied tx; tx.run on a raise, nested, and with repository calls that omit opts.tx
    source: file://shared_transaction_test.lua
    modules:
      - sql
      - uuid
      - time
      - security
    imports:
      consts: wippy.session:consts
      tx: wippy.session.persist:tx
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      artifact_repo: wippy.session.persist:artifact_repo
      message_repo: wippy.session.persist:message_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: writer_test
    kind: function.lua
    meta:
      name: Session writer (artifact updates)
      type: test
      suite: session
      comment: update_artifact checks ownership on the caller's transaction and keeps structured update errors
    source: file://writer_test.lua
    modules:
      - uuid
      - security
    imports:
      tx: wippy.session.persist:tx
      writer: wippy.session.persist:writer
      artifact_repo: wippy.session.persist:artifact_repo
      context_repo: wippy.session.persist:context_repo
      session_repo: wippy.session.persist:session_repo
      test: wippy.test:test
      wait_for_boot: app:wait_for_boot
    method: run

  - name: steering_persistence_test
    kind: function.lua
    meta:
      name: Durable steering inputs
      type: test
      suite: session
    source: file://steering_persistence_test.lua
    modules: [uuid, security, contract, sql]
    imports:
      consts: wippy.session:consts
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
      context_repo: wippy.session.persist:context_repo
      wait_for_boot: app:wait_for_boot
      test: wippy.test:test
    method: run_tests

  - name: writer_lock_test
    kind: function.lua
    meta:
      name: Session writer metadata lock
      type: test
      suite: session
      comment: Stop and pending input application must share one metadata lock
    source: file://writer_lock_test.lua
    imports:
      writer: wippy.session.persist:writer
      test: wippy.test:test
    method: run_tests
