name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WIPPY_TEST_REQUIRE_ADMISSION: "1"
  FRAMEWORK_REF: b000b42e07b8259e4f4423b9c2efc56e7d8ccb26

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: session
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: session
          persist-credentials: false
      - name: Configure external test paths
        run: |
          echo "TEST_ARTIFACTS=$RUNNER_TEMP/session-lint" >> "$GITHUB_ENV"
          echo "TEST_BACKUP_DIR=$RUNNER_TEMP/backups/session" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wippyai/framework
          ref: ${{ env.FRAMEWORK_REF }}
          path: framework
          persist-credentials: false
      - uses: ./framework/.github/actions/setup-wippy
        id: runtime
      - run: dirname "${{ steps.runtime.outputs.path }}" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      # Trojan Source guard: src and docs hold zero-width and bidirectional
      # control characters (U+200B-200F, U+202A-202E, U+2066-2069) only as
      # escape text, for example \u202e. grep exits 1 when nothing matches;
      # a match (0) or a scan error (2) fails the step.
      - name: No hidden bidirectional or zero-width characters
        run: |
          pattern=$'\xe2\x80[\x8b-\x8f\xaa-\xae]|\xe2\x81[\xa6-\xa9]'
          LC_ALL=C grep -qE "$pattern" <<< $'positive control \xe2\x80\xae' || { echo "pattern self-check failed"; exit 1; }
          for dir in src docs; do
            [ -n "$(find "$dir" -type f -print -quit)" ] || { echo "no files to scan under $dir"; exit 1; }
          done
          status=0
          LC_ALL=C grep -rnE "$pattern" src docs || status=$?
          [ "$status" -eq 1 ] && exit 0
          [ "$status" -eq 0 ] && echo "hidden characters found" || echo "scan failed with status $status"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Lint UI packages
        run: make lint-ui

      - name: Check UI packaging (dist vs. source, registry metadata vs. package.json)
        run: make check-ui

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: session
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: session
          persist-credentials: false
      - name: Configure external test paths
        run: |
          echo "TEST_ARTIFACTS=$RUNNER_TEMP/session-compatibility" >> "$GITHUB_ENV"
          echo "TEST_BACKUP_DIR=$RUNNER_TEMP/backups/session" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wippyai/framework
          ref: ${{ env.FRAMEWORK_REF }}
          path: framework
          persist-credentials: false
      - uses: ./framework/.github/actions/setup-wippy
        id: runtime
      - run: dirname "${{ steps.runtime.outputs.path }}" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Test UI packages
        run: make test-ui

  runtime:
    name: Required runtime handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: session
    env:
      FRAMEWORK_DIR: ${{ github.workspace }}/framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: session
          persist-credentials: false
      - name: Configure external test paths
        run: |
          echo "TEST_ARTIFACTS=$RUNNER_TEMP/session-runtime" >> "$GITHUB_ENV"
          echo "TEST_BACKUP_DIR=$RUNNER_TEMP/backups/session" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wippyai/framework
          ref: ${{ env.FRAMEWORK_REF }}
          path: framework
          persist-credentials: false
      - uses: ./framework/.github/actions/setup-wippy
        id: runtime
      - run: dirname "${{ steps.runtime.outputs.path }}" >> "$GITHUB_PATH"
      - name: Install candidate dependencies
        run: make install
      - name: Lint candidate
        run: make lint
      - name: Verify runtime handoff
        run: make test-runtime

  postgres:
    name: PostgreSQL persistence and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: session
    env:
      FRAMEWORK_DIR: ${{ github.workspace }}/framework
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: session_test
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U kickside -d session_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: session
          persist-credentials: false
      - name: Configure external test paths
        run: echo "TEST_ARTIFACTS=$RUNNER_TEMP/session-postgres" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wippyai/framework
          ref: ${{ env.FRAMEWORK_REF }}
          path: framework
          persist-credentials: false
      - uses: ./framework/.github/actions/setup-wippy
        id: runtime
      - run: dirname "${{ steps.runtime.outputs.path }}" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL persistence and handoff
        run: make test-postgres-full
      - name: Verify timestamp persistence outside UTC
        run: |
          make test TEST_TIMEZONE=America/New_York TEST_FILTER=app.persist:utc_timestamp_test
          make test TEST_TIMEZONE=America/New_York TEST_FILTER=app.process:attention_history_test
          make test-postgres TEST_TIMEZONE=America/New_York POSTGRES_TEST_FILTER=app.persist:utc_timestamp_test
