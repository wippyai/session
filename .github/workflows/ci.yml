name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wippy
        run: |
          curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh
          . /tmp/wippy-install.sh
          echo "$HOME/.wippy/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint UI packages
        run: make lint-ui

      - name: Check UI packaging (dist vs. source, registry metadata vs. package.json)
        run: make check-ui

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wippy
        run: |
          curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh
          . /tmp/wippy-install.sh
          echo "$HOME/.wippy/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test UI packages
        run: make test-ui
