version: "1.0"
namespace: wippy.session.api

entries:
  # wippy.session.api:delete_session
  - name: delete_session
    kind: function.lua
    meta:
      comment: Delete a user session
      router: app:api
    source: file://delete_session.lua
    modules:
      - http
      - security
    imports:
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:delete_session.endpoint
  - name: delete_session.endpoint
    kind: http.endpoint
    meta:
      comment: Delete session endpoint
      router: app:api
    method: DELETE
    func: delete_session
    path: /sessions/delete

  # wippy.session.api:artifact_access
  - name: artifact_access
    kind: library.lua
    meta:
      comment: Refusal of the artifact endpoints; a foreign or missing artifact is one generic 404
    source: file://artifact_access.lua
    modules:
      - http
    imports:
      artifact_repo: wippy.session.persist:artifact_repo

  # wippy.session.api:get_artifact_module
  # Whole-module import of the same source as get_artifact below, for tests:
  # a function.lua entry's require() gives the bound `method` function, not
  # the table, so the _serve test seam needs a library.lua registration.
  - name: get_artifact_module
    kind: library.lua
    meta:
      comment: Test-only whole-module import of get_artifact.lua
    source: file://get_artifact.lua
    modules:
      - http
      - security
    imports:
      artifact_access: wippy.session.api:artifact_access
      artifact_projection: wippy.session.persist:artifact_projection
      artifact_repo: wippy.session.persist:artifact_repo

  # wippy.session.api:get_artifact
  - name: get_artifact
    kind: function.lua
    meta:
      comment: Returns metadata for an artifact by ID
      router: app:api
    source: file://get_artifact.lua
    modules:
      - http
      - security
    imports:
      artifact_access: wippy.session.api:artifact_access
      artifact_projection: wippy.session.persist:artifact_projection
      artifact_repo: wippy.session.persist:artifact_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_artifact.endpoint
  - name: get_artifact.endpoint
    kind: http.endpoint
    meta:
      comment: Endpoint that returns metadata for an artifact
      router: app:api
    method: GET
    func: get_artifact
    path: /artifact/{id}

  # wippy.session.api:get_artifact_content_module
  # Whole-module import of get_artifact_content.lua, for the same reason as
  # get_artifact_module above.
  - name: get_artifact_content_module
    kind: library.lua
    meta:
      comment: Test-only whole-module import of get_artifact_content.lua
    source: file://get_artifact_content.lua
    modules:
      - http
      - json
      - security
    imports:
      artifact_access: wippy.session.api:artifact_access
      artifact_repo: wippy.session.persist:artifact_repo
      renderer: wippy.views:renderer

  # wippy.session.api:get_artifact_content
  - name: get_artifact_content
    kind: function.lua
    meta:
      comment: Returns content for an artifact by ID
      router: app:api
    source: file://get_artifact_content.lua
    modules:
      - http
      - json
      - security
    imports:
      artifact_access: wippy.session.api:artifact_access
      artifact_repo: wippy.session.persist:artifact_repo
      renderer: wippy.views:renderer
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_artifact_content.endpoint
  - name: get_artifact_content.endpoint
    kind: http.endpoint
    meta:
      comment: Endpoint that returns content for an artifact
      router: app:api
    method: GET
    func: get_artifact_content
    path: /artifact/{id}/content

  # wippy.session.api:artifact_state
  # Whole-module import of the same source as get_artifact_state and
  # submit_artifact_state below, for tests: a function.lua entry's require()
  # gives the bound `method` function, not the table, so the Content-Type
  # and capped-read helpers (test seams _is_json_content_type,
  # _read_capped_stream) need a library.lua registration to be reachable.
  - name: artifact_state
    kind: library.lua
    meta:
      comment: Test-only whole-module import of artifact_state.lua
    source: file://artifact_state.lua
    modules:
      - http
      - security
    imports:
      state_service: wippy.session.forms:state_service

  # wippy.session.api:get_artifact_state
  - name: get_artifact_state
    kind: function.lua
    meta:
      comment: Returns the state of a session form artifact (definition, status, staleness, accepted answer, delivery)
      router: app:api
    source: file://artifact_state.lua
    modules:
      - http
      - security
    imports:
      state_service: wippy.session.forms:state_service
    method: get
    pool:
      size: 4

  # wippy.session.api:get_artifact_state.endpoint
  - name: get_artifact_state.endpoint
    kind: http.endpoint
    meta:
      comment: Session form state endpoint
      router: app:api
    method: GET
    func: get_artifact_state
    path: /artifact/{id}/state

  # wippy.session.api:submit_artifact_state
  - name: submit_artifact_state
    kind: function.lua
    meta:
      comment: Accepts a session form answer atomically (artifact becomes idle, answer stored as a user message)
      router: app:api
    source: file://artifact_state.lua
    modules:
      - http
      - security
    imports:
      state_service: wippy.session.forms:state_service
    method: post
    pool:
      size: 4

  # wippy.session.api:submit_artifact_state.endpoint
  - name: submit_artifact_state.endpoint
    kind: http.endpoint
    meta:
      comment: Session form answer submission endpoint
      router: app:api
    method: POST
    func: submit_artifact_state
    path: /artifact/{id}/state

  # wippy.session.api:get_session_module
  # Whole-module import of the same source as get_session below, for tests:
  # a function.lua entry's require() gives the bound `method` function, not
  # the table, so the _reported_status/_lookup_session test seams need a
  # library.lua registration to be reachable.
  - name: get_session_module
    kind: library.lua
    meta:
      comment: Test-only whole-module import of get_session.lua
    source: file://get_session.lua
    modules:
      - http
      - security
    imports:
      consts: wippy.session:consts
      input_policy: wippy.session.process:input_policy
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo

  # wippy.session.api:get_session
  - name: get_session
    kind: function.lua
    meta:
      comment: Get detailed session info
      router: app:api
    source: file://get_session.lua
    modules:
      - http
      - security
    imports:
      consts: wippy.session:consts
      input_policy: wippy.session.process:input_policy
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_session.endpoint
  - name: get_session.endpoint
    kind: http.endpoint
    meta:
      comment: Get session endpoint
      router: app:api
    method: GET
    func: get_session
    path: /sessions/get

  # wippy.session.api:list_artifacts
  - name: list_artifacts
    kind: function.lua
    meta:
      comment: Lists metadata-only artifacts owned by the authenticated actor
      router: app:api
    source: file://list_artifacts.lua
    modules:
      - http
      - security
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:list_artifacts.endpoint
  - name: list_artifacts.endpoint
    kind: http.endpoint
    meta:
      comment: Actor-scoped artifact catalog with optional session filtering and cursor pagination
      router: app:api
    method: GET
    func: list_artifacts
    path: /artifacts

  # wippy.session.api:list_sessions_module
  # Whole-module import of the same source as list_sessions below, for the
  # same reason as get_session_module above.
  - name: list_sessions_module
    kind: library.lua
    meta:
      comment: Test-only whole-module import of list_sessions.lua
    source: file://list_sessions.lua
    modules:
      - http
      - security
    imports:
      consts: wippy.session:consts
      input_policy: wippy.session.process:input_policy
      session_repo: wippy.session.persist:session_repo

  # wippy.session.api:list_sessions
  - name: list_sessions
    kind: function.lua
    meta:
      comment: List all user sessions
      router: app:api
    source: file://list_sessions.lua
    modules:
      - http
      - security
    imports:
      consts: wippy.session:consts
      input_policy: wippy.session.process:input_policy
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:list_sessions.endpoint
  - name: list_sessions.endpoint
    kind: http.endpoint
    meta:
      comment: List sessions endpoint
      router: app:api
    method: GET
    func: list_sessions
    path: /sessions

  # wippy.session.api:rename_session
  - name: rename_session
    kind: function.lua
    meta:
      comment: Rename a user session
    source: file://rename_session.lua
    modules:
      - http
      - security
    imports:
      session_writer: wippy.session.persist:writer
    method: handler

  # wippy.session.api:rename_session.endpoint
  - name: rename_session.endpoint
    kind: http.endpoint
    meta:
      comment: Rename session endpoint
      router: app:api
    method: POST
    func: rename_session
    path: /sessions/rename

  # wippy.session.api:session_messages
  - name: session_messages
    kind: function.lua
    meta:
      comment: Get messages for a session
      router: app:api
    source: file://session_messages.lua
    modules:
      - http
      - security
      - time
      - json
    imports:
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:session_messages.endpoint
  - name: session_messages.endpoint
    kind: http.endpoint
    meta:
      comment: Session messages endpoint
      router: app:api
    method: GET
    func: session_messages
    path: /sessions/messages
