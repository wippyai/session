version: "1.0"
namespace: wippy.session.api

entries:
  - name: set_attention_context
    kind: function.lua
    meta:
      comment: Update normalized per-session Attention context state
      router: app:api
    source: file://set_attention_context.lua
    modules:
      - http
      - security
    imports:
      session_repo: wippy.session.persist:session_repo
      consts: wippy.session:consts
    method: handler
    pool:
      size: 4

  - name: set_attention_context.endpoint
    kind: http.endpoint
    meta:
      comment: Update session Attention context state
      router: app:api
    method: PATCH
    func: set_attention_context
    path: /sessions/{session_id}/attention-context

  - name: session_messages_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://session_messages_test.lua
    imports:
      test: wippy.test:test
      session_messages: wippy.session.api:session_messages
    method: run

  - name: context_staging_test
    kind: function.lua
    meta:
      type: test
      suite: session
    source: file://context_staging_test.lua
    modules: [hash, time]
    imports:
      test: wippy.test:test
      context_staging: wippy.session.api:context_staging
      context_attachments: wippy.session:context_attachments
    method: run

  - name: context_staging
    kind: function.lua
    meta:
      router: app:api
    source: file://context_staging.lua
    modules: [http, security, json, time]
    imports:
      session_writer: wippy.session.persist:writer
      context_attachments: wippy.session:context_attachments
      context_staging_repo: wippy.session.persist:context_staging_repo
      prompt_builder: wippy.session:prompt_builder
    method: handler
    pool:
      size: 4

  - name: context_staging.get
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: context_staging
    path: /sessions/context

  - name: context_staging.post
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: context_staging
    path: /sessions/context

  - name: context_staging.delete
    kind: http.endpoint
    meta:
      router: app:api
    method: DELETE
    func: context_staging
    path: /sessions/context

  # wippy.session.api:delete_session
  - name: delete_session
    kind: function.lua
    meta:
      comment: Delete a user session
      router: app:api
    source: file://delete_session.lua
    modules:
      - http
      - security
    imports:
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:delete_session.endpoint
  - name: delete_session.endpoint
    kind: http.endpoint
    meta:
      comment: Delete session endpoint
      router: app:api
    method: DELETE
    func: delete_session
    path: /sessions/delete

  # wippy.session.api:get_artifact
  - name: get_artifact
    kind: function.lua
    meta:
      comment: Returns metadata for an artifact by ID
      router: app:api
    source: file://get_artifact.lua
    modules:
      - http
      - json
      - security
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_artifact.endpoint
  - name: get_artifact.endpoint
    kind: http.endpoint
    meta:
      comment: Endpoint that returns metadata for an artifact
      router: app:api
    method: GET
    func: get_artifact
    path: /artifact/{id}

  # wippy.session.api:get_artifact_content
  - name: get_artifact_content
    kind: function.lua
    meta:
      comment: Returns content for an artifact by ID
      router: app:api
    source: file://get_artifact_content.lua
    modules:
      - http
      - json
      - security
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
      renderer: wippy.views:renderer
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_artifact_content.endpoint
  - name: get_artifact_content.endpoint
    kind: http.endpoint
    meta:
      comment: Endpoint that returns content for an artifact
      router: app:api
    method: GET
    func: get_artifact_content
    path: /artifact/{id}/content

  # wippy.session.api:get_session
  - name: get_session
    kind: function.lua
    meta:
      comment: Get detailed session info
      router: app:api
    source: file://get_session.lua
    modules:
      - http
      - security
    imports:
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:get_session.endpoint
  - name: get_session.endpoint
    kind: http.endpoint
    meta:
      comment: Get session endpoint
      router: app:api
    method: GET
    func: get_session
    path: /sessions/get

  # wippy.session.api:list_artifacts
  - name: list_artifacts
    kind: function.lua
    meta:
      comment: Lists metadata-only artifacts owned by the authenticated actor
      router: app:api
    source: file://list_artifacts.lua
    modules:
      - http
      - security
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:list_artifacts.endpoint
  - name: list_artifacts.endpoint
    kind: http.endpoint
    meta:
      comment: Actor-scoped artifact catalog with optional session filtering and cursor pagination
      router: app:api
    method: GET
    func: list_artifacts
    path: /artifacts

  # wippy.session.api:list_sessions
  - name: list_sessions
    kind: function.lua
    meta:
      comment: List all user sessions
      router: app:api
    source: file://list_sessions.lua
    modules:
      - http
      - security
    imports:
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:list_sessions.endpoint
  - name: list_sessions.endpoint
    kind: http.endpoint
    meta:
      comment: List sessions endpoint
      router: app:api
    method: GET
    func: list_sessions
    path: /sessions

  # wippy.session.api:rename_session
  - name: rename_session
    kind: function.lua
    meta:
      comment: Rename a user session
    source: file://rename_session.lua
    modules:
      - http
      - security
    imports:
      session_writer: wippy.session.persist:writer
    method: handler

  # wippy.session.api:rename_session.endpoint
  - name: rename_session.endpoint
    kind: http.endpoint
    meta:
      comment: Rename session endpoint
      router: app:api
    method: POST
    func: rename_session
    path: /sessions/rename

  # wippy.session.api:session_messages
  - name: session_messages
    kind: function.lua
    meta:
      comment: Get messages for a session
      router: app:api
    source: file://session_messages.lua
    modules:
      - http
      - json
      - security
      - time
    imports:
      message_repo: wippy.session.persist:message_repo
      session_repo: wippy.session.persist:session_repo
    method: handler
    pool:
      size: 4

  # wippy.session.api:session_messages.endpoint
  - name: session_messages.endpoint
    kind: http.endpoint
    meta:
      comment: Session messages endpoint
      router: app:api
    method: GET
    func: session_messages
    path: /sessions/messages
