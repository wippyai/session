version: "1.0"
namespace: wippy.session.persist

entries:
  # wippy.session.persist:tx
  - name: tx
    kind: library.lua
    meta:
      comment: Shared transaction helper for the persist layer (begin/pcall/commit-or-rollback/release); refuses nested tx.run and repository connections inside it
    source: file://tx.lua
    modules:
      - sql
    imports:
      consts: wippy.session:consts

  # wippy.session.persist:message_date
  - name: message_date
    kind: library.lua
    meta:
      comment: Locks a session row and produces message dates the store orders after every row of the session
    source: file://message_date.lua
    modules:
      - time
      - sql

  # wippy.session.persist:artifact_projection
  - name: artifact_projection
    kind: library.lua
    meta:
      comment: Shapes the metadata-response view of an artifact row, shared by the GET endpoint and the event publisher
    source: file://artifact_projection.lua
    modules:
      - json
    imports:
      consts: wippy.session:consts

  # wippy.session.persist:artifact_events
  - name: artifact_events
    kind: library.lua
    meta:
      comment: Publishes artifact-updated events to the owning user's relay hub
    source: file://artifact_events.lua
    imports:
      artifact_projection: wippy.session.persist:artifact_projection

  # wippy.session.persist:writer
  - name: writer
    kind: library.lua
    meta:
      comment: Session writer for secure write operations on sessions, messages, artifacts, and contexts
    source: file://writer.lua
    modules:
      - uuid
      - json
      - security
    imports:
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      artifact_repo: wippy.session.persist:artifact_repo
      context_repo: wippy.session.persist:context_repo
      session_contexts_repo: wippy.session.persist:session_contexts_repo

  # wippy.session.persist:artifact_repo
  - name: artifact_repo
    kind: library.lua
    meta:
      comment: Artifact repository for managing session artifacts
    source: file://artifact_repo.lua
    modules:
      - sql
      - json
      - security
      - time
    imports:
      tx: wippy.session.persist:tx

  # wippy.session.persist:context_repo
  - name: context_repo
    kind: library.lua
    meta:
      comment: Context repository for managing data and text contexts
    source: file://context_repo.lua
    modules:
      - sql
      - time
    imports:
      consts: wippy.session:consts

  # wippy.session.persist:message_repo
  - name: message_repo
    kind: library.lua
    meta:
      comment: Message repository for managing session messages
    source: file://message_repo.lua
    modules:
      - sql
      - json
    imports:
      consts: wippy.session:consts
      tx: wippy.session.persist:tx
      message_date: wippy.session.persist:message_date
      input_metadata: wippy.session:input_metadata
      form_meta: wippy.session.forms:form_meta

  # wippy.session.persist:session_contexts_repo
  - name: session_contexts_repo
    kind: library.lua
    meta:
      comment: Session contexts repository for managing additional session data
    source: file://session_contexts_repo.lua
    modules:
      - sql
      - json
      - time
    imports:
      consts: wippy.session:consts

  # wippy.session.persist:session_repo
  - name: session_repo
    kind: library.lua
    meta:
      comment: Session repository for managing user sessions
    source: file://session_repo.lua
    modules:
      - sql
      - json
      - time
    imports:
      tx: wippy.session.persist:tx

  # wippy.session.persist:reader
  - name: reader
    kind: library.lua
    meta:
      comment: Session reader with fluent query interface for messages, artifacts, and contexts
    source: file://reader.lua
    modules:
      - security
      - json
    imports:
      consts: wippy.session:consts
      session_repo: wippy.session.persist:session_repo
      message_repo: wippy.session.persist:message_repo
      artifact_repo: wippy.session.persist:artifact_repo
      session_contexts_repo: wippy.session.persist:session_contexts_repo
      context_repo: wippy.session.persist:context_repo
